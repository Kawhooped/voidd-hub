<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palette Lab — VOIDD</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#101114;color:#f2f0e9}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1000px;margin:auto}a{color:#b8c5ff}.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.muted{color:#9b9da7}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:30px 0}.swatch{height:230px;border:0;border-radius:14px;display:flex;align-items:end;justify-content:center;padding:12px;font:600 14px ui-monospace;cursor:pointer}.controls{display:flex;gap:12px;flex-wrap:wrap}button{background:#e9e5da;color:#161616;border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer}@media(max-width:650px){.swatches{grid-template-columns:repeat(2,1fr)}.swatch{height:140px}.swatch:last-child{grid-column:span 2}}
</style><body><div class="top"><a href="../">← VOIDD experiments</a><span class="muted">EXPERIMENT 001 / COLOR</span></div><h1>Palette Lab</h1><p class="muted">Generate five-color systems, lock colors you like, and copy the palette. A tiny tool with no account and no ceremony.</p><div class="swatches" id="swatches"></div><div class="controls"><button id="generate">Generate palette ↻</button><button id="copy">Copy all HEX</button><button id="reset">Unlock all</button></div><p id="status" class="muted" aria-live="polite">Click a swatch to lock or unlock it. Click its HEX to copy that color.</p><script>
const colors=['#'];let locked=Array(5).fill(false),palette=[];const root=document.querySelector('#swatches');
function rand(){return '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0').toUpperCase()}
function render(){root.innerHTML='';palette.forEach((c,i)=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.style.color=parseInt(c.slice(1),16)>0x888888?'#111':'#fff';b.textContent=c+(locked[i]?'  🔒':'');b.title='Click to lock/unlock; double-click to copy';b.onclick=()=>{locked[i]=!locked[i];render()};b.ondblclick=async()=>{await navigator.clipboard.writeText(c);document.querySelector('#status').textContent=c+' copied'};root.append(b)})}
function generate(){palette=palette.map((c,i)=>locked[i]?c:rand());render()}
palette=Array.from({length:5},rand);render();document.querySelector('#generate').onclick=generate;document.querySelector('#reset').onclick=()=>{locked.fill(false);generate()};document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(palette.join(' '));document.querySelector('#status').textContent='Palette copied'}
</script></body></html>

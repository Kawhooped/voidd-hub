<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>VOID Presentation Engine</title>
<style>
:root{--bg:#0b1018;--panel:#121c29;--panel2:#192638;--line:#2a3a4e;--text:#edf3fa;--muted:#91a2b8;--accent:#9de4d0;font:14px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{background:#1c2b3c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#07120f;font-weight:700}.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b1018ed}.brand{font-weight:800;letter-spacing:.14em}.brand b{color:var(--accent)}.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 60px)}aside{padding:18px 12px;border-right:1px solid var(--line)}aside button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;border-color:transparent}aside button.active{background:var(--panel2);color:var(--accent)}main{padding:22px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.heading h1{font-size:24px;margin:0}.muted{color:var(--muted);font-size:12px}.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.8fr);gap:14px}.box{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;min-width:0}.bar{padding:11px 14px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.1em;color:var(--muted)}.preview{padding:20px;min-height:500px}.preview h2{font-size:25px;margin:0}.preview .subtitle{color:var(--muted);margin:3px 0 22px}.section{margin:20px 0}.section h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px}.card{background:linear-gradient(140deg,#1a2a3c,#121d2a);border:1px solid var(--line);border-radius:10px;padding:13px;overflow-wrap:anywhere}.value{font-size:26px;font-weight:750}.small{font-size:11px;color:var(--muted)}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.tag{display:inline-block;padding:2px 7px;border:1px solid #37614f;border-radius:20px;color:var(--accent);font-size:10px}.editor{padding:13px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{font-size:11px}.tabs button.active{color:var(--accent);border-color:var(--accent)}textarea{width:100%;height:360px;background:#080e15;color:#d9e7f5;border:1px solid var(--line);border-radius:8px;padding:12px;font:11px/1.6 ui-monospace,monospace;resize:vertical}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.field{margin:12px 0}.field input{width:100%;padding:9px;background:#080e15;color:var(--text);border:1px solid var(--line);border-radius:8px}.status{font-size:11px;color:var(--muted);padding:10px 2px}.empty{padding:18px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}@media(max-width:850px){.workspace{grid-template-columns:1fr}.layout{grid-template-columns:58px 1fr}aside{padding:12px 5px}aside button{font-size:0;text-align:center;padding:12px 3px}aside button:after{content:attr(data-icon);font-size:17px}main{padding:14px 9px}.preview{padding:14px}.heading h1{font-size:20px}} 
</style></head><body>
<header class="top"><div class="brand"><b>◎</b> VOID / PRESENTATION ENGINE</div><div class="muted">PROTOTYPE 01 · DATA-DRIVEN UI</div></header>
<div class="layout"><aside><button class="active" data-mode="config" data-icon="⚙">Configuration</button><button data-mode="data" data-icon="▤">Content data</button><button data-mode="source" data-icon="↗">Remote source</button></aside>
<main><div class="heading"><div><h1 id="pageTitle">VOID Network</h1><div class="muted">Edit the inputs. The interface is generated from them.</div></div><div class="row"><button id="reset">Reset demo</button><button class="primary" id="save">Save on device</button></div></div>
<div class="workspace"><section class="box"><div class="bar">LIVE PAGE PREVIEW</div><div class="preview" id="preview"></div></section><section class="box"><div class="bar" id="editorTitle">PAGE CONFIGURATION</div><div class="editor"><div id="editor"></div><div class="status" id="status">Ready.</div></div></section></div></main></div>
<script>
const initialConfig={page:{title:"VOID Network",subtitle:"A data-driven view of the workspace"},sections:[{title:"Network overview",type:"metrics",data:"metrics"},{title:"Published surfaces",type:"statuses",data:"sites"},{title:"Active projects",type:"list",data:"projects"},{title:"Recent activity",type:"timeline",data:"activity"}]};
const initialData={metrics:[{label:"Public sites",value:"05",detail:"Tracked surfaces"},{label:"Visitors today",value:"128",detail:"Illustrative demo data"},{label:"Active projects",value:"07",detail:"Workspace projects"}],sites:[{name:"VOID Hub",status:"Online",detail:"GitHub repository"},{name:"SignalWorks",status:"Online",detail:"Netlify"},{name:"Site Control",status:"Review",detail:"Deployment check"}],projects:[{title:"Presentation Engine",description:"Reusable interface generated from data.",state:"Building"},{title:"Network Monitor",description:"Website availability and traffic.",state:"Planned"}],activity:[{time:"Today",title:"Presentation architecture defined",description:"Content and presentation are separated."},{time:"Today",title:"Prototype initialized",description:"One renderer, configurable sections."}]};
let config=structuredClone(initialConfig),data=structuredClone(initialData),mode="config";
const $=s=>document.querySelector(s),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){let out='<h2>'+esc(config.page?.title)+'</h2><div class="subtitle">'+esc(config.page?.subtitle)+'</div>';for(const s of config.sections||[]){let rows=data[s.data];out+='<section class="section"><h3>'+esc(s.title)+'</h3>';if(!Array.isArray(rows)||!rows.length){out+='<div class="empty">No data for '+esc(s.data)+'</div></section>';continue}if(s.type==="metrics"){out+='<div class="grid">'+rows.map(x=>'<div class="card"><div class="value">'+esc(x.value)+'</div><b>'+esc(x.label)+'</b><div class="small">'+esc(x.detail)+'</div></div>').join("")+'</div>'}else if(s.type==="statuses"){out+='<div class="grid">'+rows.map(x=>'<div class="card"><b>'+esc(x.name)+'</b><p><span class="tag">'+esc(x.status)+'</span></p><div class="small">'+esc(x.detail)+'</div></div>').join("")+'</div>'}else if(s.type==="table"){let keys=Object.keys(rows[0]);out+='<div style="overflow:auto"><table style="width:100%;text-align:left;font-size:12px"><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join("")+'</tr>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join("")+'</tr>').join("")+'</table></div>'}else{out+=rows.map(x=>'<div class="item"><div class="small">'+esc(x.time||x.state||"")+'</div><b>'+esc(x.title||x.name||"")+'</b><div class="small">'+esc(x.description||x.detail||"")+'</div></div>').join("")}out+='</section>'}$("#preview").innerHTML=out;$("#pageTitle").textContent=config.page?.title||"Untitled page"}
function showEditor(){let val=mode==="config"?config:data;$("#editorTitle").textContent=mode==="config"?"PAGE CONFIGURATION":mode==="data"?"CONTENT DATA":"REMOTE JSON SOURCE";if(mode==="source"){$("#editor").innerHTML='<div class="muted">Load a JSON endpoint that returns the content data object. The endpoint must allow browser CORS requests.</div><div class="field"><input id="url" placeholder="https://example.com/data.json"></div><div class="row"><button class="primary" id="fetch">Fetch data</button><input type="file" id="file" accept=".json,application/json"></div>';$("#fetch").onclick=async()=>{try{let r=await fetch($("#url").value);if(!r.ok)throw Error("HTTP "+r.status);data=await r.json();render();say("Remote data loaded.")}catch(e){say("Could not load: "+e.message)}};$("#file").onchange=async e=>{try{data=JSON.parse(await e.target.files[0].text());render();say("Local JSON imported.")}catch(err){say("Invalid JSON: "+err.message)}};return}$("#editor").innerHTML='<textarea id="json" spellcheck="false"></textarea><div class="row"><button class="primary" id="apply">Apply to page</button><button id="format">Format JSON</button></div><p class="muted">Edit JSON and apply. Configuration chooses the sections and component types; data supplies the records.</p>';$("#json").value=JSON.stringify(val,null,2);$("#apply").onclick=()=>{try{let v=JSON.parse($("#json").value);if(mode==="config")config=v;else data=v;render();say("Changes applied and rendered.")}catch(e){say("JSON error: "+e.message)}};$("#format").onclick=()=>{try{$("#json").value=JSON.stringify(JSON.parse($("#json").value),null,2)}catch(e){say("Cannot format invalid JSON.")}}}
function say(s){$("#status").textContent=s}document.querySelectorAll("aside button").forEach(b=>b.onclick=()=>{document.querySelectorAll("aside button").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;showEditor()});
$("#reset").onclick=()=>{config=structuredClone(initialConfig);data=structuredClone(initialData);render();showEditor();say("Demo restored.")};
$("#save").onclick=()=>{localStorage.setItem("void-presentation-config",JSON.stringify(config));localStorage.setItem("void-presentation-data",JSON.stringify(data));say("Configuration and data saved in this browser on this device.")};
$("#save").title="Saves current configuration and data to this browser's local storage.";
try{let c=localStorage.getItem("void-presentation-config"),d=localStorage.getItem("void-presentation-data");if(c)config=JSON.parse(c);if(d)data=JSON.parse(d)}catch(e){}
render();showEditor();
</script></body></html>

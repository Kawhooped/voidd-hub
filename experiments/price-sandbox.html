<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Price Sandbox — VOIDD</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:30px;max-width:760px;margin:auto;background:#101114;color:#f2f0e9;font:16px/1.5 system-ui}a{color:#b8c5ff}.muted{color:#9b9da7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px 0}label{display:grid;gap:6px;color:#bfc0c8}input{width:100%;padding:13px;border:1px solid #393b43;border-radius:9px;background:#1b1d23;color:white;font:inherit}.result{background:#1b1d23;border-radius:14px;padding:20px;margin-top:20px}.big{font-size:clamp(32px,7vw,54px);font-weight:800;letter-spacing:-2px}.good{color:#c6f36b}@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style><body><a href="../">← VOIDD experiments</a><p class="muted">EXPERIMENT 003 / SMALL BUSINESS MATH</p><h1>Price Sandbox</h1><p class="muted">Change the numbers. See what a price actually leaves behind after costs. This is a simple planning calculator, not accounting advice.</p><div class="grid"><label>Price per sale ($)<input id="price" type="number" min="0" step=".01" value="50"></label><label>Direct cost per sale ($)<input id="cost" type="number" min="0" step=".01" value="8"></label><label>Sales per month<input id="sales" type="number" min="0" step="1" value="20"></label><label>Monthly fixed costs ($)<input id="fixed" type="number" min="0" step=".01" value="120"></label></div><div class="result"><div class="muted">Estimated monthly remainder</div><div class="big good" id="profit">$720.00</div><p id="detail" class="muted"></p></div><script>
const ids=['price','cost','sales','fixed'];function calc(){let [p,c,s,f]=ids.map(id=>Math.max(0,Number(document.getElementById(id).value)||0));let margin=p-c,total=margin*s-f,fmt=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});document.querySelector('#profit').textContent=fmt(total);document.querySelector('#profit').style.color=total>=0?'#c6f36b':'#ff8f8f';document.querySelector('#detail').textContent=fmt(margin)+' contribution per sale · '+fmt(margin*s)+' before fixed costs · '+(margin>0?'Break-even: '+Math.ceil(f/margin)+' sales':'No positive contribution at this price')+' · '+(s?fmt(total/s)+' remainder per sale at this volume':'No sales entered')}
ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
